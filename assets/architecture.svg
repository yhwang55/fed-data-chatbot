<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>KCU FED System Architecture</title>
  <desc>Flow from user question through GPT analysis to FRED API, ChromaDB RAG, and SEP CSV, resulting in interactive chart and text answer</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 1. 사용자 질문 -->
  <rect x="240" y="30" width="200" height="44" rx="8" fill="#f1f0f9" stroke="#9490d4" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#3c3489" x="340" y="52" text-anchor="middle" dominant-baseline="central">사용자 질문</text>

  <!-- 화살표: 사용자 → GPT -->
  <line x1="340" y1="74" x2="340" y2="108" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. GPT 분석 -->
  <rect x="200" y="110" width="280" height="56" rx="8" fill="#eeedfe" stroke="#7f77dd" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#3c3489" x="340" y="132" text-anchor="middle" dominant-baseline="central">GPT-4o-mini 분석</text>
  <text font-family="sans-serif" font-size="12" fill="#534ab7" x="340" y="152" text-anchor="middle" dominant-baseline="central">지표 추출 · 기간 파악 · 의도 분류</text>

  <!-- 화살표: GPT → 3갈래 -->
  <path d="M260 166 L260 210 L120 210 L120 248" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="166" x2="340" y2="248" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M420 166 L420 210 L560 210 L560 248" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 레이블 -->
  <text font-family="sans-serif" font-size="12" fill="#6b7280" x="120" y="240" text-anchor="middle">수치 데이터</text>
  <text font-family="sans-serif" font-size="12" fill="#6b7280" x="340" y="240" text-anchor="middle">문서 맥락</text>
  <text font-family="sans-serif" font-size="12" fill="#6b7280" x="560" y="240" text-anchor="middle">미래 전망</text>

  <!-- 3a. FRED API -->
  <rect x="40" y="250" width="160" height="56" rx="8" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#085041" x="120" y="272" text-anchor="middle" dominant-baseline="central">FRED API</text>
  <text font-family="sans-serif" font-size="12" fill="#0f6e56" x="120" y="292" text-anchor="middle" dominant-baseline="central">실시간 경제지표 수집</text>

  <!-- 3b. ChromaDB RAG -->
  <rect x="240" y="250" width="200" height="56" rx="8" fill="#e6f1fb" stroke="#378add" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#0c447c" x="340" y="272" text-anchor="middle" dominant-baseline="central">ChromaDB RAG</text>
  <text font-family="sans-serif" font-size="12" fill="#185fa5" x="340" y="292" text-anchor="middle" dominant-baseline="central">연설문 · 회의록 검색</text>

  <!-- 3c. SEP CSV -->
  <rect x="480" y="250" width="160" height="56" rx="8" fill="#faeeda" stroke="#ba7517" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#633806" x="560" y="272" text-anchor="middle" dominant-baseline="central">SEP CSV</text>
  <text font-family="sans-serif" font-size="12" fill="#854f0b" x="560" y="292" text-anchor="middle" dominant-baseline="central">경제 전망치 조회</text>

  <!-- 화살표: 3갈래 → 결과 -->
  <path d="M120 306 L120 370 L260 370 L260 388" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="306" x2="340" y2="388" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560 306 L560 370 L420 370 L420 388" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. 최종 답변 -->
  <rect x="190" y="390" width="300" height="56" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#4a1b0c" x="340" y="412" text-anchor="middle" dominant-baseline="central">인터랙티브 차트 + 텍스트 답변</text>
  <text font-family="sans-serif" font-size="12" fill="#993c1d" x="340" y="432" text-anchor="middle" dominant-baseline="central">Plotly.js 시각화 · SEP 전망 오버레이</text>
</svg>
