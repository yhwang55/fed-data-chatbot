<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>KCU FED System Architecture</title>
  <desc>Flow from user question through GPT analysis to FRED API, ChromaDB RAG, and SEP CSV, resulting in interactive chart and text answer</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 1. User Query -->
  <rect x="240" y="30" width="200" height="44" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="14" font-weight="600" fill="#1F2937" x="340" y="52" text-anchor="middle" dominant-baseline="central">User Query</text>

  <!-- Arrow: User → GPT -->
  <line x1="340" y1="74" x2="340" y2="108" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. GPT Analysis -->
  <rect x="160" y="110" width="360" height="62" rx="8" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="13" font-weight="600" fill="#3730A3" x="340" y="130" text-anchor="middle" dominant-baseline="central">GPT-4o-mini Analysis</text>
  <text font-family="sans-serif" font-size="10.5" fill="#6366F1" x="340" y="152" text-anchor="middle" dominant-baseline="central">Indicator Extraction · Date Parsing · Intent Classification</text>

  <!-- Arrows: GPT → 3 branches -->
  <path d="M260 172 L260 212 L120 212 L120 248" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="172" x2="340" y2="248" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M420 172 L420 212 L560 212 L560 248" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Branch labels -->
  <text font-family="sans-serif" font-size="11" fill="#6b7280" x="120" y="237" text-anchor="middle">Numeric Data</text>
  <text font-family="sans-serif" font-size="11" fill="#6b7280" x="340" y="237" text-anchor="middle">Document Context</text>
  <text font-family="sans-serif" font-size="11" fill="#6b7280" x="560" y="237" text-anchor="middle">Future Projections</text>

  <!-- 3a. FRED API -->
  <rect x="40" y="250" width="160" height="58" rx="8" fill="#F0F7F4" stroke="#9DBFB5" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="13" font-weight="600" fill="#0F4C3A" x="120" y="273" text-anchor="middle" dominant-baseline="central">FRED API</text>
  <text font-family="sans-serif" font-size="10.5" fill="#3D7A6A" x="120" y="293" text-anchor="middle" dominant-baseline="central">Real-time Economic Data</text>

  <!-- 3b. ChromaDB RAG -->
  <rect x="240" y="250" width="200" height="58" rx="8" fill="#EFF4FB" stroke="#9AAFD4" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="13" font-weight="600" fill="#1B2A4A" x="340" y="273" text-anchor="middle" dominant-baseline="central">ChromaDB RAG</text>
  <text font-family="sans-serif" font-size="10.5" fill="#3B5A8A" x="340" y="293" text-anchor="middle" dominant-baseline="central">Speeches · Meeting Minutes</text>

  <!-- 3c. SEP CSV -->
  <rect x="480" y="250" width="160" height="58" rx="8" fill="#FDFAEF" stroke="#C9AA6E" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="13" font-weight="600" fill="#78350F" x="560" y="273" text-anchor="middle" dominant-baseline="central">SEP CSV</text>
  <text font-family="sans-serif" font-size="10.5" fill="#92400E" x="560" y="293" text-anchor="middle" dominant-baseline="central">Economic Projections</text>

  <!-- Arrows: 3 branches → result -->
  <path d="M120 308 L120 372 L260 372 L260 390" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="308" x2="340" y2="390" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M560 308 L560 372 L420 372 L420 390" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. Final Output -->
  <rect x="180" y="392" width="320" height="58" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="13" font-weight="600" fill="#1F2937" x="340" y="412" text-anchor="middle" dominant-baseline="central">Interactive Chart + Text Answer</text>
  <text font-family="sans-serif" font-size="10.5" fill="#6B7280" x="340" y="432" text-anchor="middle" dominant-baseline="central">Plotly.js Visualization · SEP Forecast Overlay</text>
</svg>
